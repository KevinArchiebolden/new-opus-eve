<html lang="en">

    <meta name="theme-color" content="#262121" />
    <script>
      /* Skip the intro on repeat visits within a session (set before first paint). */
      try { if (sessionStorage.getItem('oe-intro')) document.documentElement.classList.add('intro-seen') } catch (e) {}
    </script>

    <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="/assets/fonts/Chivo-Variable.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap" />
  </head>

  </body>
</html>
